services:
  - type: web
    name: room-booking
    runtime: python
    buildCommand: pip install -r requirements.txt && python manage.py migrate
    startCommand: daphne -p $PORT -b 0.0.0.0 room_booking.asgi:application
    envVars:
      # DB is Neon, not a Render-provisioned Postgres — set manually in the
      # Render dashboard, not synced from this blueprint (the free Render
      # Postgres this used to point to was cancelled long ago).
      - key: DATABASE_URL
        sync: false
      # Brevo API key for outbound email (see room_booking/email_backend.py —
      # Render blocks outbound SMTP port 587, so email goes through Brevo's
      # HTTPS API instead). Also set manually in the dashboard.
      - key: BREVO_API_KEY
        sync: false
      - key: DEBUG
        value: "False"
      - key: SECRET_KEY
        generateValue: true
      # ใช้สร้างลิงก์ในอีเมล — ไม่ตั้งแล้วลิงก์เช็คอิน/ยกเลิก/รีเซ็ตรหัสผ่านจะชี้
      # ไป localhost (ค่าเริ่มต้นใน settings.py) ตั้งเองใน dashboard:
      # SITE_URL = URL ของ backend นี้, FRONTEND_URL = URL ของหน้าเว็บ React
      - key: SITE_URL
        sync: false
      - key: FRONTEND_URL
        sync: false
      # ผู้รับอีเมลขออนุมัติการจอง (ไม่ตั้งจะใช้ค่าเริ่มต้นใน settings.py)
      - key: APPROVER_EMAIL
        sync: false
